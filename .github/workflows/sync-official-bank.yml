name: Sync official exam bank

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-bank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy published questionnaire snapshots
        run: |
          set -e
          mkdir -p official-bank
          for n in 1 2 3 4 5 6 7; do
            curl -fsSL "https://raw.githubusercontent.com/Scully-lia/examen-licencias-armas-d-e/main/tema-${n}.md" -o "official-bank/tema-${n}.md"
          done
          ls -lh official-bank
      - name: Commit local question bank
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add official-bank
          git diff --cached --quiet && exit 0
          git commit -m 'Add local official licence exam question bank'
          git push
