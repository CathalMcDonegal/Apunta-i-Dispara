name: Sync official exam bank

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-bank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build local official question bank
        run: node scripts/build-official-bank.mjs
      - name: Commit local question bank
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add official-bank.json
          git diff --cached --quiet && exit 0
          git commit -m 'Add local official licence exam question bank'
          git push
