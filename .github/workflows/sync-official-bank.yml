name: Sync official exam bank

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-bank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build local bank from published questionnaire
        shell: bash
        run: |
          python3 <<'PY'
          import json, re, urllib.request, pathlib

          base = 'https://raw.githubusercontent.com/Scully-lia/examen-licencias-armas-d-e/main/tema-{}.md'
          expected = [68,67,66,70,66,64,22]
          bank = []

          for theme in range(1,8):
              text = urllib.request.urlopen(base.format(theme), timeout=30).read().decode('utf-8')
              current = None
              options = {}
              correct = None
              num = None

              def flush():
                  nonlocal_dummy = None
                  if current and len(options) == 3 and correct in options:
                      bank.append({
                          'theme': theme,
                          'num': num,
                          'question': re.sub(r'\\s+', ' ', current).strip(),
                          'options': [re.sub(r'\\s+', ' ', options[k]).strip() for k in 'ABC'],
                          'correct': 'ABC'.index(correct)
                      })
                  return None

              for raw in text.splitlines():
                  line = raw.strip()
                  m = re.match(r'^###\\s+(\\d+)\\.\\s+(.+)$', line)
                  if m:
                      flush(); num = int(m.group(1)); current = m.group(2).strip(); options = {}; correct = None; continue
                  m = re.match(r'^-\\s+(\\*\\*)?([ABC])\\)(?:\\*\\*)?\\s*(.+)$', line)
                  if m and current:
                      letter = m.group(2).upper()
                      value = m.group(3).strip()
                      if value.startswith('**') and value.endswith('**'):
                          value = value[2:-2].strip()
                      if '✅' in value:
                          correct = letter
                          value = value.replace('✅','').replace('**','').strip()
                      options[letter] = value
                      continue
                  if current and not options and line and not line.startswith('##'):
                      current += ' ' + line

              if current and len(options) == 3 and correct in options:
                  bank.append({
                      'theme': theme,
                      'num': num,
                      'question': re.sub(r'\\s+', ' ', current).strip(),
                      'options': [re.sub(r'\\s+', ' ', options[k]).strip() for k in 'ABC'],
                      'correct': 'ABC'.index(correct)
                  })

              got = sum(1 for q in bank if q['theme'] == theme)
              if got != expected[theme-1]:
                  raise SystemExit(f'Tema {theme}: {got} preguntes; esperades {expected[theme-1]}')

          if len(bank) != sum(expected):
              raise SystemExit(f'Banc total: {len(bank)}; esperades {sum(expected)}')

          pathlib.Path('official-bank.json').write_text(json.dumps(bank, ensure_ascii=False, separators=(',',':')), encoding='utf-8')
          print(f'Generated {len(bank)} official questions')
          PY

      - name: Commit local bank
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add official-bank.json
          git diff --cached --quiet && exit 0
          git commit -m 'Add local official licence exam question bank'
          git push
